name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (lint, generated code, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: sqlc generated code is up to date
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff

      - name: Tests (race detector, real Postgres + Dragonfly via testcontainers)
        run: go test -race -count=1 ./...

      - name: Ledger invariants under 1000 random scenarios
        run: go test -count=1 -run TestLedgerInvariants ./internal/ledger/ -rapid.checks=1000

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fincore:ci .

  dashboard:
    name: Dashboard (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dashboard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

  site:
    name: Landing site (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
